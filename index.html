<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>e-BIT UTM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#005BAC">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>


<!-- ================= HOME ================= -->

<div id="home" class="container py-4">

    <div class="text-center mb-4">

        <h1 class="fw-bold">e-BIT</h1>

        <h5>Seksyen Kawalan Akses</h5>

        <small>Bahagian Keselamatan UTM</small>

    </div>


    <div class="d-grid gap-3">

        <button
            type="button"
            class="btn btn-primary btn-lg"
            onclick="pilihModul('pergerakan')">

            🚶 PERGERAKAN

        </button>


        <button
            type="button"
            class="btn btn-danger btn-lg"
            onclick="pilihModul('insiden')">

            🚨 INSIDEN

        </button>


        <button
            type="button"
            class="btn btn-success btn-lg"
            onclick="pilihModul('aktiviti')">

            🛡️ AKTIVITI

        </button>

    </div>

</div>



<!-- ================= PERGERAKAN ================= -->

<div id="pergerakan" class="container py-4" style="display:none;">


<button
class="btn btn-secondary mb-3"
onclick="showPage('home')">

← KEMBALI

</button>


<h3 class="mb-3">

🚶 PERGERAKAN ANGGOTA

</h3>



<label>Jenis Laporan</label>

<select id="jenisLaporan" class="form-control mb-3">

<option>PERGERAKAN</option>

<option>INSIDEN</option>

<option>AKTIVITI</option>

</select>



<label>Nama</label>

<select id="nama" class="form-control mb-3"></select>



<label>Syif</label>

<select id="syif" class="form-control mb-3"></select>



<label>Pos Kawalan</label>

<select id="pos" class="form-control mb-3"></select>



<label id="lblKategori">Pergerakan</label>

<select id="kategoriValue" class="form-control mb-3"></select>



<label>Catatan</label>

<textarea
id="catatan"
class="form-control mb-3"
rows="4"></textarea>



<label>Gambar</label>

<input
id="gambar"
type="file"
class="form-control mb-4"
accept="image/*">

<br>


<button
class="btn btn-primary btn-lg w-100"
onclick="submitLaporan()">

HANTAR

</button>


</div>


<script src="app.js"></script>

</body>

</html>
